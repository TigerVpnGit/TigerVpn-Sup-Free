<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>راهنمای اتصال | TigerVPN</title>
    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- کتابخانه تاریخ شمسی -->
    <script src="https://cdn.jsdelivr.net/npm/jalaali-js@1.1.5/dist/jalaali.min.js"></script>
    <style>
        /* ==================== متغیرهای تم ==================== */
        :root {
            --font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
            /* تم تاریک (شب) */
            --bg-body: #0a0f18;
            --bg-pattern: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            --bg-card: #111827;
            --bg-card-status: #1e293b; /* رنگ کارت وضعیت مشابه عکس */
            --bg-card-hover: #1f2937;
            --border-color: #2d3748;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-cyan: #06b6d4;
            --accent-cyan-glow: rgba(6, 182, 212, 0.15);
            --accent-purple: #8b5cf6;
            --accent-purple-glow: rgba(139, 92, 246, 0.15);
            --danger: #ef4444; /* رنگ قرمز برای دایره درصد */
            --success: #10b981;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            --modal-overlay: rgba(0, 0, 0, 0.75);
        }

        /* تم روشن (روز) */
        [data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-pattern: linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            --bg-card: #ffffff;
            --bg-card-status: #f8fafc;
            --bg-card-hover: #f1f5f9;
            --border-color: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-cyan: #0891b2;
            --accent-cyan-glow: rgba(8, 145, 178, 0.15);
            --accent-purple: #7c3aed;
            --accent-purple-glow: rgba(124, 58, 237, 0.15);
            --danger: #e11d48;
            --success: #059669;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --modal-overlay: rgba(0, 0, 0, 0.5);
        }

        /* ==================== ریست و پایه ==================== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-family);
            background-color: var(--bg-body);
            background-image: var(--bg-pattern);
            background-size: 40px 40px;
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }

        /* ==================== کانتینر ==================== */
        .app-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }

        /* هدر */
        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-card); padding: 12px 20px; border-radius: 12px;
            border: 1px solid var(--border-color); box-shadow: var(--shadow);
            flex-wrap: wrap; gap: 10px;
        }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        
        /* منوی کشویی زبان */
        .lang-select {
            background: var(--bg-body); color: var(--text-primary);
            border: 1px solid var(--border-color); padding: 8px 12px;
            border-radius: 8px; font-family: inherit; font-size: 0.9rem;
            cursor: pointer; outline: none; transition: border-color 0.2s;
        }
        .lang-select:hover, .lang-select:focus { border-color: var(--accent-cyan); }

        /* دکمه تم */
        .theme-toggle {
            background: var(--bg-body); border: 1px solid var(--border-color);
            color: var(--text-secondary); width: 38px; height: 38px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
        }
        .theme-toggle:hover { color: var(--accent-cyan); border-color: var(--accent-cyan); }

        /* دکمه دریافت لینک (بالای صفحه) */
        .top-action-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 14px; background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
            color: #fff; font-weight: bold; font-size: 1.1rem; border: none; border-radius: 12px;
            cursor: pointer; box-shadow: 0 4px 15px var(--accent-purple-glow); transition: opacity 0.2s;
        }
        .top-action-btn:hover { opacity: 0.9; }

        /* ==================== کارت وضعیت (شبیه عکس دوم) ==================== */
        .status-card {
            background: var(--bg-card-status);
            border: 1px solid var(--border-color);
            border-radius: 16px; padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: var(--shadow); gap: 15px;
        }
        .status-info { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .status-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-primary); }
        .status-row span.label { color: var(--text-secondary); }
        .status-row span.value { font-weight: bold; direction: ltr; }
        
        .status-chart-container { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 120px; }
        .status-ring {
            width: 90px; height: 90px; border-radius: 50%;
            background: conic-gradient(var(--danger) 0%, transparent 0);
            display: flex; justify-content: center; align-items: center;
            position: relative;
        }
        .status-ring::before {
            content: ''; position: absolute; width: 74px; height: 74px;
            background: var(--bg-card-status); border-radius: 50%;
        }
        .status-ring-text { position: relative; z-index: 1; font-size: 1.1rem; font-weight: 800; color: var(--danger); }
        .status-badge {
            background: var(--success); color: #fff; padding: 4px 12px;
            border-radius: 20px; font-size: 0.75rem; font-weight: bold;
        }

        /* ==================== آکاردئون ==================== */
        .accordion-group { display: flex; flex-direction: column; gap: 12px; }
        .accordion-item {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; overflow: hidden; transition: border-color 0.2s;
        }
        .accordion-item:hover { border-color: var(--accent-cyan); }
        .accordion-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; cursor: pointer; background: var(--bg-card); user-select: none;
        }
        .accordion-header:hover { background: var(--bg-card-hover); }
        .accordion-title { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1rem; }
        .accordion-icon { transition: transform 0.3s; }
        .accordion-item.active .accordion-icon { transform: rotate(180deg); }
        .accordion-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s ease; }
        .accordion-item.active .accordion-body { grid-template-rows: 1fr; }
        .accordion-content { overflow: hidden; padding: 0 20px; transition: padding 0.3s ease; }
        .accordion-item.active .accordion-content { padding: 0 20px 20px 20px; }

        /* تب‌ها و دکمه‌ها */
        .app-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .app-tab-btn {
            flex: 1; min-width: 100px; background: var(--bg-body); border: 1px solid var(--border-color);
            color: var(--text-secondary); padding: 10px; border-radius: 8px;
            cursor: pointer; font-family: inherit; font-size: 0.9rem; font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s;
        }
        .app-tab-btn.active { background: var(--bg-card); border-color: var(--accent-cyan); color: var(--accent-cyan); }

        /* کارت‌های مراحل */
        .step-card {
            background: var(--bg-body); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 16px; margin-bottom: 12px;
            display: flex; align-items: flex-start; gap: 15px;
        }
        .step-icon { color: var(--accent-cyan); }
        .step-content { flex: 1; }
        .step-title { font-size: 1rem; font-weight: bold; margin-bottom: 4px; }
        .step-desc { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 12px; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn {
            display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
            border-radius: 6px; font-family: inherit; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; text-decoration: none; transition: all 0.2s;
        }
        .btn-cyan { background: var(--accent-cyan-glow); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
        .btn-cyan:hover { background: var(--accent-cyan); color: #fff; }
        .btn-purple { background: var(--accent-purple-glow); color: var(--accent-purple); border: 1px solid var(--accent-purple); }
        .btn-purple:hover { background: var(--accent-purple); color: #fff; }

        /* ==================== شبکه‌های اجتماعی ==================== */
        .social-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
        .social-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px; border-radius: 10px; text-decoration: none;
            font-weight: bold; font-size: 0.9rem; transition: transform 0.2s, opacity 0.2s;
        }
        .social-btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn-telegram-bot { background: #0088cc; color: #fff; }
        .btn-telegram-chan { background: #229ED9; color: #fff; }
        .btn-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: #fff; }

        /* ==================== مودال (پنجره بارکد) ==================== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--modal-overlay); display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 16px; width: 90%; max-width: 400px; padding: 20px;
            box-shadow: var(--shadow); position: relative; transform: translateY(20px); transition: transform 0.3s;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color);
        }
        .modal-title { font-weight: bold; font-size: 1.1rem; }
        .modal-close {
            background: transparent; border: none; color: var(--text-secondary);
            cursor: pointer; font-size: 1.5rem; line-height: 1; padding: 5px;
        }
        .modal-close:hover { color: var(--danger); }
        .qr-container {
            display: flex; justify-content: center; align-items: center;
            background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px;
        }
        .qr-container img { width: 100%; max-width: 200px; height: auto; display: block; }
        .modal-desc { text-align: center; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 15px; }
        .modal-copy-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 12px; background: var(--accent-cyan); color: #fff;
            border: none; border-radius: 8px; font-family: inherit; font-size: 1rem;
            font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        .modal-copy-btn:hover { background: #0891b2; }

        /* ==================== ریسپانسیو ==================== */
        @media (max-width: 600px) {
            .status-card { flex-direction: column; text-align: center; }
            .status-info { align-items: center; }
            .step-card { flex-direction: column; align-items: center; text-align: center; }
            .step-title, .step-desc { text-align: center; }
            .btn-group { justify-content: center; width: 100%; }
            .btn { width: 100%; justify-content: center; }
        }

        /* آیکون‌ها */
        .icon { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- آکاردئون راهنما -->
        <div class="accordion-group">
            <div class="accordion-item active" id="acc-guide">

                <div class="accordion-body">
                    <div class="accordion-content">
                        <!-- انتخاب سیستم‌عامل -->
                        <div id="os-selector" style="margin-bottom: 15px; display: flex; gap: 8px; justify-content: center;"></div>
                        <!-- انتخاب اپلیکیشن -->
                        <div class="app-tabs" id="app-tabs"></div>
                        <!-- کارت‌های مراحل -->

                    </div>
                </div>
            </div>
        </div>

        <!-- بخش پشتیبانی و شبکه‌های اجتماعی -->

                </div>

    <!-- مودال دریافت لینک و QR Code -->
    <div class="modal-overlay" id="qrModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" data-i18n="modal_title">دریافت لینک</span>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="qr-container">
                <!-- تصویر QR Code از API گوگل تولید می‌شود -->
                <img id="qrImage" src="" alt="QR Code">
            </div>

            const timeDiffPassed = now.getTime() - startDate.getTime();
            
            // درصد سپری شده (اگر تاریخ امروز قبل از شروع سال باشد، 0 است)
            let percentPassed = Math.floor((timeDiffPassed / timeDiffTotal) * 100);
            if (percentPassed < 0) percentPassed = 0;
            if (percentPassed > 100) percentPassed = 100;

            // نمایش تاریخ انقضا
            const expiryEl = document.getElementById('expiry-val');
            if (currentLang === 'fa') {
                expiryEl.textContent = `${currentJYear}/12/${endDay}`;
            } else {
                const options = { year: 'numeric', month: '2-digit', day: '2-digit' };
                expiryEl.textContent = expiryDate.toLocaleDateString(currentLang === 'ru' ? 'ru-RU' : 'en-US', options);
            }

            // نمایش روزهای باقی‌مانده
            document.getElementById('days-val').textContent = daysLeft;

            // نمایش حجم
            document.getElementById('traffic-val').textContent = translations[currentLang].unlimited;

            // آپدیت دایره درصد
            document.getElementById('ring-text').textContent = `${percentPassed}%`;
            const ring = document.getElementById('status-ring');
            // استفاده از رنگ قرمز برای دایره مشابه عکس
            ring.style.background = `conic-gradient(var(--danger) ${percentPassed}%, transparent 0)`;
        }

        // ==================== ۱۰. شروع برنامه ====================
        window.onload = function() {
            initTheme(); // تنظیم تم شب/روز
            currentOS = detectOS();
            
            if (appsData[currentOS] && appsData[currentOS].length > 0) {
                currentApp = appsData[currentOS][0].id;
            }

            setLanguage('fa'); // تنظیم زبان پیش‌فرض
            
            renderOSSelector();
            updateDateAndStatus(); // محاسبه تاریخ پایان سال
            
            document.getElementById('acc-guide').classList.add('active');
        };
    </script>
</body>
</html>
