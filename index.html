    <style>
        :root {
            --radius: 14px;
            --sky: #38bdf8;
            --purple: #7c3aed;
            --gradient: linear-gradient(135deg, #38bdf8 0%, #7c8cf8 45%, #a855f7 100%);
            --bg-1: #eaf3ff;
            --bg-2: #f4eeff;
            --text: #1c1b2e;
            --muted: #5f5c7d;
            --border: rgba(124,58,237,.15);
            --glass-bg: rgba(255,255,255,.55);
            --glass-border: rgba(124,58,237,.18);
            --glass-shadow: 0 8px 24px rgba(80,60,180,.10);
            --accent: #7c3aed;
            --danger: #ef4444;
            --success: #10b981;
            --modal-overlay: rgba(0, 0, 0, 0.5);
        }

        [data-theme="dark"] {
            --bg-1: #0d1024;
            --bg-2: #160f2b;
            --text: #d1d5db;
            --muted: #9ca3af;
            --border: rgba(168,133,255,.22);
            --glass-bg: rgba(255,255,255,.06);
            --glass-border: rgba(168,133,255,.28);
            --glass-shadow: 0 8px 30px rgba(0,0,0,.45);
            --accent: #c084fc;
            --danger: #f43f5e;
            --success: #10b981;
            --modal-overlay: rgba(0, 0, 0, 0.75);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-1); }
        ::-webkit-scrollbar-thumb { background: var(--gradient); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        body {
            color: var(--text);
            line-height: 1.6;
            background:
                radial-gradient(1100px 500px at 15% -10%, rgba(56,189,248,.28), transparent 60%),
                radial-gradient(900px 500px at 100% 0%, rgba(168,85,247,.24), transparent 55%),
                linear-gradient(180deg, var(--bg-1), var(--bg-2));
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'Vazirmatn', "Segoe UI", "Tahoma", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            justify-content: center;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image:
                linear-gradient(to right, rgba(124, 58, 237, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(124, 58, 237, 0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        [data-theme="dark"] body::before {
            background-image:
                linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            transition: all 0.3s ease;
            border-radius: var(--radius);
        }
        .glass:hover {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4), 0 0 40px rgba(56, 189, 248, 0.2);
            border-color: rgba(168, 85, 247, 0.6);
        }
        .text-gradient {
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.4;
            padding-bottom: 0.3rem;
            display: inline-block;
        }
        .os-card {
            border-radius: var(--radius);
            transition: all 0.2s ease;
            background: var(--glass-bg);
            border: 1px solid var(--border);
            color: var(--muted);
            cursor: pointer;
        }
        .os-card.selected {
            background: var(--gradient);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 14px 30px rgba(124,58,237,.35);
        }

        .app-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 15px; }

        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; flex-wrap: wrap; gap: 10px;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }

        .select-wrapper { position: relative; display: inline-block; }
        .lang-select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background: transparent; color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px 8px 32px;
            border-radius: 8px; font-family: inherit; font-size: 0.9rem;
            cursor: pointer; outline: none; transition: all 0.2s;
        }
        html[dir="ltr"] .lang-select { padding: 8px 32px 8px 12px; }

        .lang-select:hover, .lang-select:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--glass-border); }
        .lang-select option { background: var(--bg-1); color: var(--text); }

        .select-arrow {
            position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
            pointer-events: none; width: 14px; height: 14px; fill: var(--muted);
        }
        html[dir="ltr"] .select-arrow { left: auto; right: 10px; }

        .theme-toggle {
            background: transparent; border: 1px solid var(--border);
            color: var(--text); width: 38px; height: 38px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
        }
        .theme-toggle:hover { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 15px var(--glass-border); }

        .qr-header-btn {
            display: flex; align-items: center; gap: 6px;
            background: var(--gradient); color: #fff;
            border: none; padding: 8px 16px; border-radius: 8px;
            font-family: inherit; font-weight: bold; font-size: 0.9rem;
            cursor: pointer; transition: all 0.2s;
        }
        .qr-header-btn:hover { opacity: 0.9; box-shadow: 0 0 15px rgba(168, 85, 247, 0.5); }

        .social-bar { display: flex; gap: 10px; padding: 10px; border-radius: var(--radius); }
        .social-item {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 10px; border-radius: 10px; text-decoration: none;
            font-weight: bold; font-size: 0.9rem; transition: all 0.2s;
            border: 1px solid transparent;

        .social-item.tg:hover { background: #0088cc; color: #fff; box-shadow: 0 5px 15px rgba(0, 136, 204, 0.4); border-color: #0088cc; transform: translateY(-2px); }
        .social-item.insta { background: linear-gradient(45deg, rgba(240, 148, 51, 0.1), rgba(188, 24, 136, 0.1)); color: #dc2743; border-color: rgba(220, 39, 67, 0.3); }
        .social-item.insta:hover { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: #fff; box-shadow: 0 5px 15px rgba(220, 39, 67, 0.4); border-color: transparent; transform: translateY(-2px); }

        .status-card { padding: 20px; display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .status-info { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .status-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text); }
        .status-row span.label { color: var(--muted); }
        .status-row span.value { font-weight: bold; direction: ltr; }

        .status-chart-container { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 120px; }
        .status-ring {
            width: 90px; height: 90px; border-radius: 50%;
            background: conic-gradient(var(--danger) 0%, transparent 0);
            display: flex; justify-content: center; align-items: center;
            position: relative; box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);

        .status-ring::before { content: ''; position: absolute; width: 74px; height: 74px; background: var(--bg-1); border-radius: 50%; }
        .status-ring-text { position: relative; z-index: 1; font-size: 1.1rem; font-weight: 800; color: var(--danger); }
        .status-badge { background: var(--success); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }

        .accordion-group { display: flex; flex-direction: column; gap: 12px; }
        .accordion-item { overflow: hidden; }
        .accordion-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; cursor: pointer; user-select: none; transition: background 0.2s; }
        .accordion-header:hover { background: rgba(255,255,255,0.05); }
        [data-theme="light"] .accordion-header:hover { background: rgba(0,0,0,0.03); }
        .accordion-title { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1rem; }
        .accordion-icon { transition: transform 0.3s; }
        .accordion-item.active .accordion-icon { transform: rotate(180deg); }
        .accordion-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s ease; }
        .accordion-item.active .accordion-body { grid-template-rows: 1fr; }
        .accordion-content { overflow: hidden; padding: 0 20px; transition: padding 0.3s ease; }
        .accordion-item.active .accordion-content { padding: 0 20px 20px 20px; }

        .app-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .app-tab-btn { flex: 1; min-width: 100px; padding: 10px; font-family: inherit; font-size: 0.9rem; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 6px; }

        .step-card { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; display: flex; align-items: flex-start; gap: 15px; transition: all 0.2s; }
        [data-theme="light"] .step-card { background: rgba(255, 255, 255, 0.4); }
        .step-card:hover { border-color: var(--accent); }
        .step-icon { color: var(--sky); }
        .step-content { flex: 1; }
        .step-title { font-size: 1rem; font-weight: bold; margin-bottom: 4px; }
        .step-desc { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 8px; }

        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-family: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; }
        .btn-cyan { background: rgba(56, 189, 248, 0.15); color: var(--sky); border: 1px solid var(--sky); }
        .btn-cyan:hover { background: var(--sky); color: #fff; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
        .btn-purple { background: rgba(124, 58, 237, 0.15); color: var(--purple); border: 1px solid var(--purple); }
        .btn-purple:hover { background: var(--purple); color: #fff; box-shadow: 0 0 15px rgba(124, 58, 237, 0.4); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--modal-overlay); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content { width: 90%; max-width: 400px; padding: 20px; position: relative; transform: translateY(20px); transition: transform 0.3s; }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .modal-title { font-weight: bold; font-size: 1.1rem; }
        .modal-close { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 1.5rem; line-height: 1; padding: 5px; }
        .modal-close:hover { color: var(--danger); }
        .qr-container { display: flex; justify-content: center; align-items: center; background: #fff; padding: 15px; border-radius: var(--radius); margin-bottom: 15px; }
        .qr-container img { width: 100%; max-width: 200px; height: auto; display: block; }
        .modal-desc { text-align: center; font-size: 0.85rem; color: var(--muted); margin-bottom: 15px; }
        .modal-copy-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; background: var(--gradient); color: #fff; border: none; border-radius: 8px; font-family: inherit; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .modal-copy-btn:hover { opacity: 0.9; box-shadow: 0 0 20px rgba(168, 85, 247, 0.5); }

        @media (max-width: 600px) {
            .header-bar { flex-direction: column; align-items: stretch; }
            .header-left { justify-content: space-between; width: 100%; }
            .qr-header-btn { width: 100%; justify-content: center; }
            .social-bar { flex-direction: column; }
            .status-card { flex-direction: column; text-align: center; }
            .status-info { align-items: center; }
            .step-card { flex-direction: column; align-items: center; text-align: center; }
            .step-title, .step-desc { text-align: center; }
            .btn-group { justify-content: center; width: 100%; }
            .btn { width: 100%; justify-content: center; }
        }

        .icon { width: 20px; height: 20px; }
    </style>
</head>

        let currentLang = 'fa';

        function initTheme() {
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const hour = new Date().getHours();
            const isNightTime = (hour >= 18 || hour < 6);
            if (prefersDark || (!window.matchMedia && isNightTime)) { currentTheme = 'dark'; } else { currentTheme = 'light'; }
            applyTheme();
        }

        function applyTheme() {
            document.documentElement.setAttribute('data-theme', currentTheme);
            const icon = document.getElementById('themeBtn');
            if (currentTheme === 'dark') {
                icon.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
            } else {
                icon.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
            }
        }

        function toggleTheme() {
            currentTheme = (currentTheme === 'dark') ? 'light' : 'dark';
            applyTheme();
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'fa') ? 'rtl' : 'ltr';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (translations[lang] && translations[lang][key]) { el.textContent = translations[lang][key]; }
            });
            updateDateAndStatus();
            renderOSSelector();
            renderAppTabs();
            renderSteps();
        }

        function toggleAccordion(id) { document.getElementById(id).classList.toggle('active'); }

        function detectOS() {
            const ua = navigator.userAgent.toLowerCase();
            if (ua.includes('android')) return 'android';
            if (ua.includes('iphone') || ua.includes('ipad') || ua.includes('ipod')) return 'ios';
            if (ua.includes('win')) return 'windows';
            if (ua.includes('mac')) return 'mac';
            return 'android';
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.style.cssText = `position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--gradient); color:#fff; padding:12px 24px; border-radius:12px; z-index:9999; font-family:inherit; font-weight:bold; box-shadow:0 8px 25px rgba(168, 85, 247, 0.4); transition: opacity 0.3s;`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2500);
        }

        function openModal() {
            const qrImg = document.getElementById('qrImage');
            qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(SUB_LINK)}&color=7c3aed&bgcolor=ffffff`;
            document.getElementById('qrModal').classList.add('active');

        function closeModal() { document.getElementById('qrModal').classList.remove('active'); }

            navigator.clipboard.writeText(SUB_LINK).then(() => {

                btnElement.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> کپی شد!';

            const container = document.getElementById('app-tabs');
            const apps = appsData[currentOS] || [];
            if (!apps.find(a => a.id === currentApp)) { currentApp = apps.length > 0 ? apps[0].id : null; }

        }

        function renderSteps() {
            const container = document.getElementById('guide-steps');
            const app = appsData[currentOS]?.find(a => a.id === currentApp);
            if (!app) { container.innerHTML = ''; return; }
            const t = translations[currentLang];
            let installButtons = currentOS === 'android' ? `<a href="${app.market}" target="_blank" class="btn btn-cyan">${t.open_gplay}</a><a href="${app.apk}" target="_blank" class="btn btn-cyan">${t.download_apk}</a>` : `<a href="${app.market}" target="_blank" class="btn btn-cyan">Download</a>`;
            let encodedSub = encodeURIComponent(SUB_LINK);
            let deepLink = `${app.scheme}${encodedSub}`;
            let addButtonAction = (currentOS === 'windows') ? `onclick="copySubLink(this)"` : `onclick="triggerDeepLink('${deepLink}')"`;

            container.innerHTML = `

            `;
        }

        function switchOS(os) { currentOS = os; renderOSSelector(); renderAppTabs(); renderSteps(); }
        function switchApp(appId) { currentApp = appId; renderAppTabs(); renderSteps(); }
        function triggerDeepLink(url) { showToast(translations[currentLang].toast_opening); window.location.href = url; }

        function updateDateAndStatus() {
            const now = new Date();
            let jNow = jalaali.toJalaali(now.getFullYear(), now.getMonth() + 1, now.getDate());
            let currentJYear = jNow.jy;
            let endDay = jalaali.isLeapJalaaliYear(currentJYear) ? 30 : 29;
            let endOfYearG = jalaali.toGregorian(currentJYear, 12, endDay);
            let expiryDate = new Date(endOfYearG.gy, endOfYearG.gm - 1, endOfYearG.gd, 23, 59, 59);
            let startOfYearG = jalaali.toGregorian(currentJYear, 1, 1);
            let startDate = new Date(startOfYearG.gy, startOfYearG.gm - 1, startOfYearG.gd);

            let daysLeft = Math.ceil((expiryDate.getTime() - now.getTime()) / (1000 * 3600 * 24));
            if (daysLeft < 0) daysLeft = 0;

            let timeDiffTotal = expiryDate.getTime() - startDate.getTime();
            let timeDiffPassed = now.getTime() - startDate.getTime();
            let percentPassed = Math.floor((timeDiffPassed / timeDiffTotal) * 100);
            if (percentPassed < 0) percentPassed = 0;
            if (percentPassed > 100) percentPassed = 100;

            const expiryEl = document.getElementById('expiry-val');
            if (currentLang === 'fa') { expiryEl.textContent = `${currentJYear}/12/${endDay}`; }
            else { expiryEl.textContent = expiryDate.toLocaleDateString(currentLang === 'ru' ? 'ru-RU' : 'en-US', { year: 'numeric', month: '2-digit', day: '2-digit' }); }

            document.getElementById('days-val').textContent = daysLeft;
            document.getElementById('traffic-val').textContent = translations[currentLang].unlimited;
            document.getElementById('ring-text').textContent = `${percentPassed}%`;
            document.getElementById('status-ring').style.background = `conic-gradient(var(--danger) ${percentPassed}%, transparent 0)`;
        }

        window.onload = function() {
            initTheme();
            currentOS = detectOS();
            if (appsData[currentOS] && appsData[currentOS].length > 0) { currentApp = appsData[currentOS][0].id; }
            setLanguage('fa');
            renderOSSelector();
            updateDateAndStatus();
            document.getElementById('acc-guide').classList.add('active');
        };
